# HTTPS server (production with Let's Encrypt certificates)
server {
    listen 443 ssl http2;
    server_name rhapido.com.br www.rhapido.com.br;

    # SSL certificates (generated by certbot/Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/rhapido.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rhapido.com.br/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Redirect www to non-www
    if ($host = www.rhapido.com.br) {
        return 301 https://rhapido.com.br$request_uri;
    }

    # Proxy to Next.js
    location / {
        proxy_pass http://nextjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name rhapido.com.br www.rhapido.com.br;

    # Redirect all HTTP to HTTPS
    return 301 https://rhapido.com.br$request_uri;
}
