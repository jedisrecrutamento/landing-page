version: '3.8'

services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rhapido-nextjs
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - rhapido-network

  nginx:
    image: nginx:alpine
    container_name: rhapido-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - nextjs
    networks:
      - rhapido-network

networks:
  rhapido-network:
    driver: bridge
