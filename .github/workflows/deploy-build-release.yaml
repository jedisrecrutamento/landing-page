name: Build & Push to GHCR

on:
  push:
    branches: ["main","feat/argocd-deploy"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/rhapido-landingpage

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar Dockerfile da aplicação
        run: |
          echo "=== Dockerfile na raiz do repo (deve ser Node/Next.js) ==="
          head -5 Dockerfile
          grep -q 'node:20-alpine' Dockerfile && echo "OK: Dockerfile é da aplicação Next.js" || (echo "ERRO: Dockerfile não é o da aplicação!" && exit 1)

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_SECRET || secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem (Next.js)
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
