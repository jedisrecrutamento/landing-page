apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhapido-landingpage
  namespace: rhapido-landingpage
  labels:
    app: rhapido-landingpage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rhapido-landingpage
  template:
    metadata:
      labels:
        app: rhapido-landingpage
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: rhapido-landingpage
          image: ghcr.io/jedisrecrutamento/rhapido-landingpage:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
